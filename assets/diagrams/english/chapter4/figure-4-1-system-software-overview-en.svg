<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,3 L0,6 Z" fill="#355f87"/>
    </marker>
    <style>
      .box{fill:#fff;stroke:#456f98;stroke-width:2}.divider{stroke:#456f98;stroke-width:2}
      .title{font:700 21px Arial,sans-serif;fill:#111}.subtitle{font:700 18px Arial,sans-serif;fill:#111}
      .body{font:16px Arial,sans-serif;fill:#111}.label{font:700 15px Arial,sans-serif;fill:#111}
      .link{fill:none;stroke:#355f87;stroke-width:2;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1200" height="660" fill="#fff"/>

  <rect class="box" x="20" y="20" width="440" height="370" rx="8"/>
  <line class="divider" x1="20" y1="68" x2="460" y2="68"/>
  <text class="title" x="240" y="51" text-anchor="middle">Main positioning-node firmware</text>
  <text class="body" x="240" y="108" text-anchor="middle">One shared firmware image</text>
  <text class="body" x="240" y="142" text-anchor="middle">Role selected by configuration</text>
  <rect class="box" x="48" y="170" width="180" height="190" rx="8"/>
  <line class="divider" x1="48" y1="212" x2="228" y2="212"/>
  <text class="subtitle" x="138" y="198" text-anchor="middle">Tag mode</text>
  <text class="body" x="138" y="248" text-anchor="middle">Initiate ranging</text>
  <text class="body" x="138" y="286" text-anchor="middle">Collect ranges</text>
  <text class="body" x="138" y="324" text-anchor="middle">Estimate position</text>
  <rect class="box" x="252" y="170" width="180" height="190" rx="8"/>
  <line class="divider" x1="252" y1="212" x2="432" y2="212"/>
  <text class="subtitle" x="342" y="198" text-anchor="middle">Anchor mode</text>
  <text class="body" x="342" y="248" text-anchor="middle">Respond to ranging</text>
  <text class="body" x="342" y="286" text-anchor="middle">Return RESULT</text>
  <text class="body" x="342" y="324" text-anchor="middle">Save power</text>

  <rect class="box" x="535" y="95" width="260" height="230" rx="8"/>
  <line class="divider" x1="535" y1="140" x2="795" y2="140"/>
  <text class="title" x="665" y="125" text-anchor="middle">BLE peripheral firmware</text>
  <text class="body" x="665" y="188" text-anchor="middle">Runs on FSC-BT630</text>
  <text class="body" x="665" y="229" text-anchor="middle">Advertising and connection</text>
  <text class="body" x="665" y="270" text-anchor="middle">Command and status relay</text>

  <rect class="box" x="900" y="95" width="270" height="230" rx="8"/>
  <line class="divider" x1="900" y1="140" x2="1170" y2="140"/>
  <text class="title" x="1035" y="125" text-anchor="middle">BLE central firmware</text>
  <text class="body" x="1035" y="188" text-anchor="middle">Nordic nRF52840 dongle</text>
  <text class="body" x="1035" y="229" text-anchor="middle">Scan and manage connections</text>
  <text class="body" x="1035" y="270" text-anchor="middle">Relay between BLE and USB</text>

  <rect class="box" x="835" y="440" width="335" height="180" rx="8"/>
  <line class="divider" x1="835" y1="485" x2="1170" y2="485"/>
  <text class="title" x="1002" y="470" text-anchor="middle">RTLS monitoring application</text>
  <text class="body" x="1002" y="530" text-anchor="middle">Uses only the BLE data path</text>
  <text class="body" x="1002" y="568" text-anchor="middle">Configuration and monitoring</text>
  <text class="body" x="1002" y="606" text-anchor="middle">Display coordinates and record logs</text>

  <rect class="box" x="20" y="470" width="205" height="150" rx="8"/>
  <line class="divider" x1="20" y1="515" x2="225" y2="515"/>
  <text class="subtitle" x="122" y="500" text-anchor="middle">Update and test</text>
  <text class="body" x="122" y="554" text-anchor="middle">USB firmware update</text>
  <text class="body" x="122" y="586" text-anchor="middle">Diagnostic capture</text>
  <text class="body" x="122" y="610" text-anchor="middle">Testing and debugging</text>

  <rect class="box" x="285" y="470" width="220" height="150" rx="8"/>
  <line class="divider" x1="285" y1="515" x2="505" y2="515"/>
  <text class="subtitle" x="395" y="500" text-anchor="middle">Autonomous controller</text>
  <text class="body" x="395" y="558" text-anchor="middle">Direct interface to the Tag</text>
  <text class="body" x="395" y="598" text-anchor="middle">over USB</text>

  <path class="link" d="M460 190 H535"/><path class="link" d="M535 220 H460"/>
  <text class="label" x="497" y="175" text-anchor="middle">UART</text>
  <path class="link" d="M795 190 H900"/><path class="link" d="M900 220 H795"/>
  <text class="label" x="847" y="175" text-anchor="middle">BLE</text>
  <path class="link" d="M1035 325 V440"/><path class="link" d="M1005 440 V325"/>
  <text class="label" x="1054" y="390">USB</text>
  <path class="link" d="M122 470 L150 390"/><text class="label" x="90" y="427">USB</text>
  <path class="link" d="M395 470 L350 390"/><text class="label" x="382" y="427">USB</text>
</svg>
