enum fota_state_index_t {
  FOTA_STATE_UNSPECIFIED = 0;
  FOTA_STATE_IDLE        = 1;
  FOTA_STATE_ERASING     = 2;
  FOTA_STATE_RECEIVING   = 3;
  FOTA_STATE_VERIFYING   = 4;
  FOTA_STATE_FINISHED    = 5;
  FOTA_STATE_ERROR       = 6;
}

message fota_state_resp_t {
