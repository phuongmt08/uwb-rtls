}

/* Battery information -----------------------------------------------------------*/

message battery_info_get_t {
    uint32 dummy = 1;
}

message battery_info_resp_t {
    uint32 bat_voltage_mv  = 1;
    uint32 bat_soc_percent = 2;
    int32  remaining_min   = 3;
    bool   is_charging     = 4;

    /* Hardware telemetry fields */
    float  mcu_temp_c       = 5;  /* MCU internal temperature in degrees Celsius */
    uint32 mcu_voltage_mv          = 6;  /* Actual MCU voltage in mV */
    float  uwb_temp_c       = 7;  /* DW1000 chip internal temperature in degrees Celsius */
    uint32 uwb_voltage_mv      = 8;  /* DW1000 supply voltage in mV */
    float  imu_temp_c       = 9;  /* IMU sensor internal temperature in degrees Celsius */
    
    uint32 error_mask       = 10; /* Bitmask of breached thresholds */
}

/* Factory OTP provisioning -------------------------------------------------- */
message factory_otp_write_t {
    uint32 confirm_magic     = 1; /* Must be 0x4F545057 ('OTPW') */
    uint32 otp_type          = 2; /* firmware/common/otp/otp.h OTP_TYPE_* */
    device_type_t device_type = 3; /* Used by OTP_TYPE_DEVICE_INFO */
    uint32 tx_antenna_delay  = 4;
    uint32 rx_antenna_delay  = 5;
    uint32 value_u32         = 6; /* DDMMYYYY mfg_date for OTP_TYPE_DEVICE_INFO */
    uint32 value_u8          = 7; /* hw_rev for OTP_TYPE_DEVICE_INFO */
}
/* Session ------------------------------------------------------------------- */
message end_session_t {
    session_end_reason_t reason = 1;
}

