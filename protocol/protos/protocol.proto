    float known_m = 2;
    float mean_m = 3;
    float error_m = 4;
    float std_m = 5;
    float timeout_rate = 6;
    uint32 valid_count = 7;
    int32 delta_dw = 8;
    uint32 suggested_combined_delay = 9;
    uint32 suggested_tx_delay = 10;
    uint32 suggested_rx_delay = 11;
}

message calib_status_resp_t {
    calib_state_t state         = 1;
    uint32 progress_percent     = 2;
    uint32 current_iteration    = 3 [deprecated = true];
    uint32 total_iterations     = 4 [deprecated = true];
    float last_pair_error_mean_m = 5 [deprecated = true];
    uint32 current_antenna_delay = 6;
    uint32 peer_ready_mask      = 7;
    float last_pair_error_spread_m = 8 [deprecated = true];
    uint32 rejected_batch_count = 9;
    float last_pair_error_rms_m = 10;
    float last_pair_error_max_abs_m = 11;
    float last_pair_error_mean_abs_m = 12;
    uint32 sample_count = 13;
    uint32 sample_target = 14;
    uint32 candidate_mask = 15;
    repeated calib_anchor_candidate_t candidates = 16;
}


/* Status / diagnostics ----------------------------------------------------- */

/*
 * Compact RTOS health snapshot. This is intentionally pull-only and contains
 * no per-task array so it can coexist with log and ranging streams.
 *
 * health_flags:
 *   bit 0: CPU busy above threshold
 *   bit 1: free heap below threshold
 *   bit 2: minimum task stack below threshold
 *   bit 3: task snapshot truncated
 *   bit 4: CPU/task statistics unavailable
 */
message rtos_resource_get_t {
    uint32 dummy = 1;
}

message rtos_resource_resp_t {
    uint32 sample_window_ms          = 1;
    uint32 cpu_busy_permille         = 2; /* 1000 = 100% */
    uint32 heap_free_bytes           = 3;
    uint32 heap_min_ever_free_bytes  = 4;
    uint32 min_stack_free_bytes      = 5;
    uint32 min_stack_task_id         = 6;
    uint32 task_count                = 7;
    uint32 health_flags              = 8;
}

/* Per-task details for the current bounded task set. */
message rtos_task_stats_get_t {
    uint32 dummy = 1;
}

message rtos_task_stat_t {
    uint32 task_id              = 1; /* Valid for the current boot only */
    uint32 cpu_permille         = 2; /* 1000 = 100% */
    uint32 stack_min_free_bytes = 3;
    string name                 = 4;
}

message rtos_task_stats_resp_t {
    repeated rtos_task_stat_t tasks = 1;
}

message ranging_status_get_t {
    uint32 dummy = 1;
}

message ranging_status_resp_t {
    uint32 ranging_period_ms         = 1;
    uint32 ranging_total_count       = 2;
    uint32 ranging_success_count     = 3;
    uint32 ranging_failed_count      = 4;
    uint32 ranging_timeout_count     = 5;
    uint32 last_ranging_time_ms      = 6;
    float last_rms_error_m           = 7;
    int32 last_avg_rssi_dbm          = 8;
    uint32 last_update_timestamp_ms  = 9;
}

