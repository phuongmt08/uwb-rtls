}

message calib_data_t {
    uint32 anchor_mask               = 1;
    uint32 tx_frame_cnt              = 2;
    float ax                         = 3;
    float ay                         = 4;
    float gz                         = 5;
    float px                         = 6;
    float py                         = 7;
    repeated float distance          = 8;
    repeated double fp_amp_norm      = 9;
    repeated double fp_snr           = 10;
    uint32 error_frame_cnt           = 11;
    float dt                         = 12;
}

/* Packet ------------------------------------------------------------------- */

message packet_t {
    hdr_t hdr = 1;

    oneof params {
        /* Core */
        none_t                    none                    = 2;
        ack_t                     ack                     = 3;

        /* Device info */
        device_information_get_t  device_information_get  = 4;
        device_information_resp_t device_information_resp = 5;

        /* Time sync */
        time_sync_get_t           time_sync_get           = 6;
        time_sync_set_t           time_sync_set           = 7;
        time_sync_resp_t          time_sync_resp          = 8;
